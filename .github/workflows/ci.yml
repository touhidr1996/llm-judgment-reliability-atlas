name: ci
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.11.33
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: uv run python -m judgment_atlas.pipeline
